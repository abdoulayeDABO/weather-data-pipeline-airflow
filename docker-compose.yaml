x-airflow-common: &airflow-common
  image: apache/airflow:3.4.0 
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://api-server:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__API__SECRET_KEY: change-me-secret
    AIRFLOW__API_AUTH__JWT_SECRET: change-me-jwt-secret
    PYTHONPATH: /opt/airflow/scripts
  env_file:
    - .env
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  init-db:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
    command: db migrate

  api-server:
    <<: *airflow-common
    depends_on:
      init-db:
        condition: service_completed_successfully
    command: api-server
    ports:
      - "8080:8080"

  scheduler:
    <<: *airflow-common
    depends_on:
      init-db:
        condition: service_completed_successfully
    command: scheduler

  dag-processor:
    <<: *airflow-common
    depends_on:
      init-db:
        condition: service_completed_successfully
    command: dag-processor

volumes:
  postgres_data: